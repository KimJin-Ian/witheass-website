<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>7가지 확인 항목 답변</title>
<style>
  :root{
    --navy-900:#0a1228; --gold-600:#c4a661; --gold-50:#fbf8f1;
    --text-700:#464d5e; --line:#e9e5db; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:675px;overflow:hidden;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--white); color:var(--navy-900);
    display:flex;flex-direction:column;justify-content:center;
    padding:52px 76px; word-break:keep-all;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{
    font-size:15px;letter-spacing:.32em;color:var(--gold-600);
    font-weight:700;margin-bottom:12px;
  }
  h1{font-size:38px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
  .rule{width:56px;height:4px;background:var(--gold-600);margin-bottom:26px}
  table{width:100%;border-collapse:collapse;font-size:21px}
  thead th{
    background:var(--navy-900);color:#fff;font-weight:700;font-size:19px;
    padding:14px 22px;text-align:left;
  }
  thead th:first-child{border-radius:10px 0 0 0;width:290px}
  thead th:last-child{border-radius:0 10px 0 0}
  tbody td{padding:13px 22px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:nth-child(even){background:var(--gold-50)}
  tbody td:first-child{font-weight:700;color:var(--navy-900)}
  tbody td:last-child{color:#8a6d2f;font-weight:600}
</style>
</head>
<body data-w="1200" data-h="675">
  <div class="eyebrow">OUR ANSWER</div>
  <h1>7가지 확인 항목, 저희 기준</h1>
  <div class="rule"></div>

  <table>
    <thead>
      <tr><th>확인 항목</th><th>드림위드에스</th></tr>
    </thead>
    <tbody>
      <tr><td>저작권 · ISBN 명의</td><td>저자 본인 명의</td></tr>
      <tr><td>인세</td><td>종이책 45% · 전자책 20%</td></tr>
      <tr><td>올인원 패키지</td><td>900만원 (인터뷰~유통 전과정)</td></tr>
      <tr><td>1차 원고</td><td>인터뷰 2회 후 약 4주</td></tr>
      <tr><td>전체 제작 기간</td><td>원고 수령일로부터 50~70일</td></tr>
      <tr><td>원고 수정</td><td>2회 (표지 2개 시안 · 2회 수정)</td></tr>
      <tr><td>유통 기간</td><td>기본 2년 · 전국 서점 + 전자책</td></tr>
    </tbody>
  </table>
</body>
</html>
