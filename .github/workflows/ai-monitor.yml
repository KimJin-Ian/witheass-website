# AI 노출 모니터링 — 매일 아침 질문 30개를 AI 서비스에 묻고 결과를 data/ai-monitor/ 에 저장한다.
# 결과가 저장되면 사이트가 다시 배포되어 관리자 화면(/admin/monitoring)에 반영된다.
#
# 필요한 값 (저장소 Settings → Secrets and variables → Actions → New repository secret)
#   OPENAI_API_KEY   ChatGPT 수집
#   GEMINI_API_KEY   Gemini 수집
#   SERPAPI_KEY      Google AI 개요 · 구글 검색 순위 (선택)
#   DEEPSEEK_API_KEY DeepSeek 수집 (선택)
# 키가 하나도 없으면 아무것도 바꾸지 않고 끝난다.
name: AI 노출 모니터링

on:
  schedule:
    - cron: "37 22 * * *" # 매일 07:37 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 수집
        run: node scripts/ai-monitor.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      - name: 결과 저장
        run: |
          if git diff --quiet -- data/ai-monitor; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-monitor/latest.json data/ai-monitor/history.json
          git commit -m "AI 노출 모니터링: $(TZ=Asia/Seoul date +%Y-%m-%d) 수집 결과"
          git push
